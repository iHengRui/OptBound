symbols:
- key: F
  latex: F
  aliases:
  - f
  - \bar f
  category: objective
  definition_en: global objective, \(F(x)=N^{-1}\sum_{i=1}^N F_i(x)\)
  definition_zh: 全局目标函数，\(F(x)=\frac1n\sum_{i=1}^n F_i(x)\)
- key: F_i
  latex: F_i
  aliases:
  - f_i
  category: objective
  definition_en: local objective at node \(i\)
  definition_zh: 节点 \(i\) 的局部目标函数
- key: F_star
  latex: F^\star
  aliases:
  - F_*
  - f^\star
  - f_*
  category: objective
  definition_en: optimal value, \(F^\star=\inf_x F(x)\)
  definition_zh: 最优目标值，\(F^\star=\inf_x F(x)\)
- key: Delta
  latex: \Delta
  aliases:
  - initial_gap
  category: problem_parameter
  definition_en: initial optimality gap, \(\Delta=F(x^0)-F^\star\)
  definition_zh: 初始目标差，通常为 \(F(x^0)-F^\star\)
- key: Delta_0
  latex: \Delta_0
  aliases: []
  category: problem_parameter
  definition_en: initial objective-gap bound, \(\Delta_0\ge F(x^0)-F^\star\)
  definition_zh: 论文特定的初始 Lyapunov 量或初始目标差
  source_arxiv:
  - '2210.03232'
  - '1912.12110'
  - '2606.04757'
- key: n
  latex: N
  aliases:
  - n
  - m
  - M_agents
  category: problem_parameter
  definition_en: number of nodes
  definition_zh: 节点数或智能体数
- key: i
  latex: i
  aliases: []
  category: index
  definition_en: node index
  definition_zh: 节点下标
- key: j
  latex: j
  aliases: []
  category: index
  definition_en: local component index
  definition_zh: 定理原式中使用的节点下标
- key: t
  latex: t
  aliases:
  - k
  category: index
  definition_en: iteration index
  definition_zh: 迭代或通信轮次下标
- key: T
  latex: T
  aliases:
  - K
  category: problem_parameter
  definition_en: iteration horizon
  definition_zh: 目标或定理原式中的迭代轮数
- key: T_out
  latex: T_{\rm out}
  aliases:
  - T_{\mathrm{out}}
  category: problem_parameter
  definition_en: outer-iteration horizon when each outer step contains a local batch or multiple gossip rounds
  definition_zh: 每个外层步包含本地 batch 或多轮 gossip 时的外层迭代轮数
- key: K_loc
  latex: K_{\rm loc}
  aliases:
  - K_{\mathrm{loc}}
  category: problem_parameter
  definition_en: number of local component functions, where \(f_{ij}\) is component \(j\) at node \(i\) and \(F_i(x)=K_{\rm
    loc}^{-1}\sum_{j=1}^{K_{\rm loc}}f_{ij}(x)\)
  definition_zh: 每个节点的本地 finite-sum 样本数
- key: S
  latex: S
  aliases: []
  category: problem_parameter
  definition_en: epoch index
  definition_zh: 论文特定的 epoch 下标
  source_arxiv:
  - '2112.10389'
- key: L
  latex: L
  aliases:
  - smoothness
  category: problem_parameter
  definition_en: smoothness constant satisfying \(\|\nabla F_i(x)-\nabla F_i(y)\|\le L\|x-y\|\) for every node \(i\)
  definition_zh: 光滑常数
- key: bar_L
  latex: \bar L
  aliases:
  - \hat L
  - \widehat L
  category: problem_parameter
  definition_en: mean-squared component smoothness constant satisfying \((N K_{\rm loc})^{-1}\sum_{i=1}^N\sum_{j=1}^{K_{\rm
    loc}}\|\nabla f_{ij}(x)-\nabla f_{ij}(y)\|^2\le \bar L^2\|x-y\|^2\)
  definition_zh: 论文特定的均方光滑常数
  source_arxiv:
  - '2210.13931'
- key: mu
  latex: \mu
  aliases:
  - strong_convexity
  category: problem_parameter
  definition_en: strong-convexity constant satisfying \(h(y)\ge h(x)+\langle g,y-x\rangle+\frac{\mu}{2}\|y-x\|^2\)
    for \(g\in\partial h(x)\)
  definition_zh: 强凸常数
- key: kappa
  latex: \kappa
  aliases: []
  category: problem_parameter
  definition_en: condition number, \(\kappa=L/\mu\)
  definition_zh: 条件数，\(\kappa=L/\mu\)
- key: kappa_A
  latex: \kappa_A
  aliases: []
  category: network_parameter
  definition_en: equilibrium skewness of row-stochastic matrix \(A\), \(\kappa_A=\max_i(\pi_A)_i/\min_i(\pi_A)_i\)
  definition_zh: 论文特定的有向网络条件数
  source_arxiv:
  - '2506.04600'
- key: kappa_pi
  latex: \kappa_\pi
  aliases: []
  category: network_parameter
  definition_en: equilibrium skewness of column-stochastic matrix \(W_\pi\), \(\kappa_\pi=\max_i\pi_i/\min_i\pi_i\)
  definition_zh: 论文特定的 push-sum 或有向网络条件数
  source_arxiv:
  - '2312.04928'
- key: kappa_s
  latex: \kappa_s
  aliases: []
  category: problem_parameter
  definition_en: mean-squared finite-sum condition number, \(\kappa_s=\bar L/\mu\)
  definition_zh: 论文特定的随机或 finite-sum 条件数
  source_arxiv:
  - '2210.13931'
  - '2402.02490'
- key: kappa_s_VR
  latex: \kappa_{s,\rm VR}
  aliases: []
  category: problem_parameter
  definition_en: VR-EXTRA/DIGing stochastic condition number, \(\kappa_{s,\rm VR}=\mu^{-1}\max_i K_{\rm loc}^{-1}\sum_{j=1}^{K_{\rm
    loc}}L_{ij}\), where \(L_{ij}\) is the smoothness constant of component \(j\) at node \(i\)
  definition_zh: VR-EXTRA/DIGing paper-specific stochastic condition number
  source_arxiv:
  - '2009.04373'
- key: q_dpsvrg
  latex: q_{\rm DPS}
  aliases:
  - q_{\mathrm{DPS}}
  category: problem_parameter
  definition_en: DPSVRG exponent \(q_{\rm DPS}=\log(1/r_{\rm DPS})/\log\beta_{\rm DPS}\in(0,1)\)
  definition_zh: DPSVRG 的几何 epoch 增长与收缩率决定的指数
  source_arxiv:
  - '2112.10389'
- key: eps
  latex: \eps
  aliases:
  - \epsilon
  - epsilon
  - varepsilon
  category: target_accuracy
  definition_en: target accuracy, \(\eps>0\)
  definition_zh: 目标精度
- key: expectation
  latex: \E
  aliases:
  - \mathbb{E}
  category: stochastic_operator
  definition_en: expectation operator
  definition_zh: 期望算子
- key: sigma2
  latex: \sigma^2
  aliases:
  - variance
  category: stochastic_parameter
  definition_en: stochastic-gradient variance bound, \(\E\|g_i(x;\xi_i)-\nabla F_i(x)\|^2\le\sigma^2\); \(g_i(x;\xi_i)\)
    denotes the stochastic first-order oracle output at node \(i\), evaluated at \(x\) using local random sample \(\xi_i\)
  definition_zh: 随机梯度方差上界
- key: sigma
  latex: \sigma
  aliases: []
  category: stochastic_parameter
  definition_en: standard-deviation bound, \(\sigma=\sqrt{\sigma^2}\)
  definition_zh: 随机梯度方差上界的平方根
- key: M
  latex: M
  aliases:
  - lipschitz
  category: problem_parameter
  definition_en: uniform local subgradient bound satisfying \(\|g_i(x)\|\le M\) for every \(g_i(x)\in\partial F_i(x)\)
  definition_zh: 非光滑 Lipschitz 常数或次梯度范数上界；不用于表示节点数
- key: R
  latex: R
  aliases:
  - radius
  category: problem_parameter
  definition_en: initial-distance bound satisfying \(\|x^0-x^\star\|\le R\)
  definition_zh: 初始距离或定义域半径
- key: rho
  latex: \rho
  aliases: []
  category: network_parameter
  definition_en: spectral gap, \(\rho=1-\|W-N^{-1}\mathbf 1_N\mathbf 1_N^\top\|_2\)
  definition_zh: 固定 gossip 矩阵的谱 gap
- key: rho_K
  latex: \rho_{\rm K}
  aliases:
  - \rho_{\mathrm K}
  category: network_parameter
  definition_en: reference-specific spectral gap, \(\rho_{\rm K}=1-\lambda_2(P)\), for the fixed symmetric doubly
    stochastic gossip matrix \(P\), where \(\lambda_2(P)\) is the second-largest eigenvalue of \(P\)
  definition_zh: reference-specific spectral gap
  source_arxiv:
  - '2606.04757'
- key: beta_H
  latex: \beta_{\rm H}
  aliases:
  - \beta_{\mathrm H}
  category: network_parameter
  definition_en: one-step mixing factor satisfying \(\|W^t-N^{-1}\mathbf 1_N\mathbf 1_N^\top\|_2\le\beta_{\rm H}<1\)
  definition_zh: one-step mixing factor
  source_arxiv:
  - '2211.00533'
- key: beta_A
  latex: \beta_A
  aliases: []
  category: network_parameter
  definition_en: row-stochastic mixing factor of \(A\), \(\beta_A=\|A-\mathbf 1_N\pi_A^\top\|_{\pi_A}\in[0,1)\), where
    \(\Pi_A=\operatorname{diag}(\pi_A)\) and \(\|B\|_{\pi_A}:=\|\Pi_A^{1/2}B\Pi_A^{-1/2}\|_2\) is the induced weighted
    matrix norm
  definition_zh: 论文特定的有向网络 mixing parameter
  source_arxiv:
  - '2506.04600'
- key: beta_pi
  latex: \beta_\pi
  aliases: []
  category: network_parameter
  definition_en: column-stochastic mixing factor of \(W_\pi\), \(\beta_\pi=\|W_\pi-\pi\mathbf 1_N^\top\|_\pi\in[0,1)\),
    where \(\Pi=\operatorname{diag}(\pi)\) and \(\|B\|_\pi:=\|\Pi^{-1/2}B\Pi^{1/2}\|_2\) is the induced weighted matrix
    norm
  definition_zh: 论文特定的 push-sum 或有向网络 mixing parameter
  source_arxiv:
  - '2312.04928'
- key: delta_net
  latex: \delta_{\rm net}
  aliases:
  - network_gap
  category: network_parameter
  definition_en: normalized network contraction rate, \(\delta_{\rm net}:=p_{\rm mix}/\tau_{\rm mix}\), where \(1-p_{\rm
    mix}\) is the \(\tau_{\rm mix}\)-step expected squared-consensus-error factor
  definition_zh: 通用网络 gap；当论文不适合写成静态 \(\rho\) 时使用
  source_arxiv:
  - '2003.10422'
- key: delta_g
  latex: \delta_{\rm G}
  aliases:
  - Goldstein_delta
  category: target_parameter
  definition_en: Goldstein-stationarity radius
  definition_zh: Goldstein stationarity 半径，不是网络 gap
- key: W
  latex: W
  aliases: []
  category: network_parameter
  definition_en: doubly stochastic mixing matrix \(W\in\mathbb R^{N\times N}\) satisfying \(W\mathbf 1_N=\mathbf 1_N\)
    and \(\mathbf 1_N^\top W=\mathbf 1_N^\top\)
  definition_zh: gossip 或 mixing 矩阵
- key: omega_W
  latex: \omega(\widehat W)
  aliases: []
  category: network_parameter
  definition_en: smallest positive eigenvalue of the positive semidefinite gossip/Laplacian operator \(\widehat W\)
  definition_zh: 论文特定的图连通性或谱量
  source_arxiv:
  - '2004.02635'
- key: eta
  latex: \eta
  aliases: []
  category: algorithm_parameter
  definition_en: positive stepsize
  definition_zh: 论文特定的步长或惩罚参数
  source_arxiv:
  - '2309.02626'
  - '2601.03566'
- key: theta_pl
  latex: \theta
  aliases: []
  category: algorithm_parameter
  definition_en: linear contraction parameter \(\theta\in(0,1)\) in the factor \((1-\theta)^t\)
  definition_zh: 原始对偶 PL 线性收敛定理中的收缩参数
  source_arxiv:
  - '1912.12110'
- key: c_pl
  latex: c
  aliases: []
  category: problem_parameter
  definition_en: initial error constant in the primal-dual PL bound
  definition_zh: 原始对偶 PL 线性收敛定理中的初始 Lyapunov 常数
  source_arxiv:
  - '1912.12110'
- key: alpha_DSP
  latex: \alpha_{\rm DSP}
  aliases:
  - \alpha_{\mathrm{DSP}}
  category: problem_parameter
  definition_en: positive constant
  definition_zh: D-SPIDER-SFO 推论中的三次精度残差系数
  source_arxiv:
  - '1911.12665'
- key: ell_DSP
  latex: \ell_{\rm DSP}
  aliases:
  - \ell_{\mathrm{DSP}}
  category: problem_parameter
  definition_en: D-SPIDER-SFO complexity coefficient
  definition_zh: D-SPIDER-SFO 中乘在三次精度项前的定理特定系数
  source_arxiv:
  - '1911.12665'
- key: eta_alg
  latex: \eta_{\rm alg}
  aliases: []
  category: algorithm_parameter
  definition_en: positive DAGP auxiliary parameter
  definition_zh: DAGP 收敛定理中的正辅助参数
  source_arxiv:
  - '2210.03232'
- key: C_S
  latex: C_{\mathbf S}
  aliases: []
  category: network_parameter
  definition_en: DAGP network-and-algorithm factor satisfying \(C_{\mathbf S}>-\lambda_{\min}(\mathbf S)\), where
    \(\mathbf S\) is the theorem matrix determined by the gossip matrices and algorithm parameters
  definition_zh: DAGP 定理中由 gossip 矩阵和算法参数决定的网络因子
  source_arxiv:
  - '2210.03232'
- key: C_DDA
  latex: C_{\rm DDA}
  aliases: []
  category: problem_parameter
  definition_en: DDA constant coefficient
  definition_zh: DDA 残差定理中由初始误差、步长、光滑性和网络收缩决定的显式系数
  source_arxiv:
  - '2211.06914'
- key: C_2
  latex: C_2
  aliases: []
  category: problem_parameter
  definition_en: DAGP heterogeneity coefficient
  definition_zh: DAGP 中最优点处的约束与目标异质性量
  source_arxiv:
  - '2210.03232'
- key: bar_zeta
  latex: \bar\zeta
  aliases:
  - \bar{\zeta}
  category: problem_parameter
  definition_en: root-mean-square local-gradient heterogeneity at a global optimum, \(\bar\zeta=(N^{-1}\sum_{i=1}^N\|\nabla
    F_i(x^\star)\|^2)^{1/2}\)
  definition_zh: 全局最优点处局部梯度的均方根异质性
  source_arxiv:
  - '2003.10422'
- key: zeta_stat2
  latex: \zeta_{\rm stat}^2
  aliases:
  - \zeta_{\mathrm{stat}}^2
  category: stochastic_parameter
  definition_en: uniform cross-node gradient-heterogeneity bound satisfying \(N^{-1}\sum_{i=1}^N\|\nabla F_i(x)-\nabla
    F(x)\|^2\le\zeta_{\rm stat}^2\) for all \(x\)
  definition_zh: 所有点上局部梯度与全局梯度差异的统一上界
  source_arxiv:
  - '2412.07252'
- key: p_comm
  latex: p_{\rm comm}
  aliases:
  - p_{\mathrm{comm}}
  category: algorithm_parameter
  definition_en: communication probability, \(p_{\rm comm}\in(0,1]\)
  definition_zh: MG-Skip 触发通信的概率
  source_arxiv:
  - '2312.11861'
- key: p
  latex: p
  aliases: []
  category: problem_parameter
  definition_en: higher-order smoothness degree, an integer \(p\ge2\) such that \(\|\mathcal D^pF_i(X)-\mathcal D^pF_i(Y)\|_*\le
    L_{p,*}\|X-Y\|\) for some \(L_{p,*}>0\), where \(\mathcal D^p\) is the \(p\)-th derivative
  definition_zh: 高阶光滑性的整数阶数
  source_arxiv:
  - '2510.01377'
- key: Psi0
  latex: \Psi^0
  aliases: []
  category: problem_parameter
  definition_en: initial MG-Skip Lyapunov value
  definition_zh: 论文特定的初始 Lyapunov 值
  source_arxiv:
  - '2312.11861'
- key: x_i
  latex: x_i
  aliases:
  - x_i(t)
  category: output
  definition_en: local iterate/output at node \(i\); \(x_i^t\) is its value at iteration \(t\), while the unindexed
    form is the theorem's returned output
  definition_zh: 节点 \(i\) 的输出或局部变量
- key: x_bar
  latex: \bar x
  aliases:
  - \bar{x}
  - x_{\mathrm{bar}}
  category: output
  definition_en: network-average iterate/output, \(\bar x^t=N^{-1}\sum_{i=1}^N x_i^t\); the unindexed \(\bar{x}\)
    denotes the averaged output specified by the cited theorem
  definition_zh: 节点平均输出，\(\bar x=\frac1n\sum_{i=1}^n x_i\)
- key: x_o_i
  latex: x_{o,i}
  aliases: []
  category: output
  definition_en: output selected by node \(i\) from its internal memory
  definition_zh: 非光滑时变网络下界模型中节点从本地内存选取的输出
  source_arxiv:
  - '2405.18031'
- key: x_o_K
  latex: x_o^T
  aliases: []
  category: output
  definition_en: network-average output, \(x_o^T=N^{-1}\sum_{i=1}^N x_{a,i}^T\), where \(x_{a,i}^T\) is node \(i\)'s
    component of the averaged primal vector \(x_a^T\)
  definition_zh: 非光滑时变网络上界算法的全局平均输出
  source_arxiv:
  - '2405.18031'
- key: x_bar_i_K
  latex: \bar x_{i,T}
  aliases:
  - \bar{x}_{i,K}
  category: output
  definition_en: time-averaged output at node \(i\), \(\bar x_{i,T}=T^{-1}\sum_{t=0}^{T-1}x_i^t\)
  definition_zh: DAGP 定理中节点在 K 次迭代后的时间平均输出
  source_arxiv:
  - '2210.03232'
- key: y_bar_T
  latex: \bar y_T
  aliases:
  - \bar{y}_T
  category: output
  definition_en: averaged primal output after \(T\) iterations
  definition_zh: 去中心化复合优化算法在 T 次迭代后返回的平均原变量
  source_arxiv:
  - '2312.15845'
- key: x_hat_i_T
  latex: \hat x_i(T)
  aliases:
  - \hat{x}_i(T)
  category: output
  definition_en: time-averaged output at node \(i\), \(\hat x_i(T)=T^{-1}\sum_{t=1}^T x_i^t\)
  definition_zh: 节点 i 的时间平均输出
  source_arxiv:
  - '1005.2012'
- key: x_tilde_i_T
  latex: \tilde x_i^T
  aliases:
  - \tilde{x}_\ell^T
  category: output
  definition_en: time-averaged output at node \(i\), \(\tilde x_i^T=T^{-1}\sum_{t=1}^T x_i^t\)
  definition_zh: node i equiweighted ergodic output
  source_arxiv:
  - '2506.12901'
- key: x_hat
  latex: \hat x
  aliases:
  - \hat{x}
  category: output
  definition_en: the algorithm output used to evaluate the accuracy criterion in the corresponding source; its specific
    construction follows the theorem cited in that row
  definition_zh: 对应文献中用于评价该行精度指标的算法输出点，其具体取法以该行引用的定理为准。
  source_arxiv:
  - '2210.13931'
  - '2211.00533'
  - '2210.07863'
  - '2006.08085'
  - '1910.04057'
  - '2402.02490'
  - '1904.09015'
  - '2110.01594'
  - '2406.01484'
- key: y_hat
  latex: \hat y
  aliases:
  - \hat{y}
  category: output
  definition_en: tuple of node-wise time-averaged outputs
  definition_zh: 论文特定 Err 目标中的节点时间平均输出组
  source_arxiv:
  - '1411.4186'
- key: x_tilde
  latex: \tilde x
  aliases:
  - \tilde{x}
  category: output
  definition_en: virtual centralized output after epoch \(S\) in DPSVRG
  definition_zh: DPSVRG 速率陈述中的虚拟中心化快照输出
  source_arxiv:
  - '2112.10389'
- key: x_tilde_i
  latex: \tilde x_i
  aliases:
  - \tilde{x}_i
  - \tilde{x}_{i}
  category: output
  definition_en: weighted time-averaged output at node \(i\), \(\tilde x_i=A_T^{-1}\sum_{t=1}^T a_t x_i^t\), where
    \(A_T=\sum_{t=1}^T a_t\) and \(a_t>0\) are theorem-specified averaging weights
  definition_zh: 节点 \(i\) 的论文特定辅助或快照输出
  source_arxiv:
  - '2106.14075'
  - '1806.07081'
- key: x_star
  latex: x^\star
  aliases:
  - x^*
  - x_*
  category: output
  definition_en: optimizer of \(F\), \(x^\star\in\arg\min_x F(x)\)
  definition_zh: \(F\) 的最优解
- key: X
  latex: X
  aliases: []
  category: output
  definition_en: stacked local iterate/output, \(X^t=[(x_1^t)^\top,\ldots,(x_N^t)^\top]^\top\); the unindexed form
    is the returned stacked output
  definition_zh: 节点变量堆叠矩阵
- key: X_star
  latex: X^\star
  aliases:
  - X^*
  category: output
  definition_en: stacked consensus optimizer, \(X^\star=\mathbf 1_N\otimes x^\star\)
  definition_zh: 堆叠的最优解或一致最优点
- key: y
  latex: y
  aliases: []
  category: output
  definition_en: consensus auxiliary primal iterate in DDA, \(y^t=\nabla d^*(-\bar z^t)\), where \(d^*\) is the conjugate
    of the prox function
  definition_zh: 论文特定的辅助原变量或对偶变量
  source_arxiv:
  - '2211.06914'
- key: bold_y
  latex: \mathbf y
  aliases:
  - \mathbf{y}
  category: output
  definition_en: stacked auxiliary iterate in DDA, \(\mathbf y^t=\mathbf 1_N\otimes y^t\)
  definition_zh: DDA 一致性残差中的堆叠辅助原变量
  source_arxiv:
  - '2211.06914'
- key: z
  latex: z
  aliases: []
  category: output
  definition_en: node-wise dual accumulator \(z_i^t\) in DDA
  definition_zh: 论文特定的辅助原变量或对偶变量
  source_arxiv:
  - '2211.06914'
- key: z_bar
  latex: \bar z
  aliases:
  - \bar{z}
  category: output
  definition_en: network-average auxiliary iterate, \(\bar z^t=N^{-1}\sum_{i=1}^N z_i^t\)
  definition_zh: 论文特定辅助变量的平均量
  source_arxiv:
  - '2211.06914'
- key: G
  latex: G
  aliases: []
  category: target
  definition_en: Bregman distance of the stacked separable objective, \(G(X,X^\star)=\sum_{i=1}^N[F_i(X_i)-F_i(x^\star)-\langle\nabla
    F_i(x^\star),X_i-x^\star\rangle]\), where \(X_i\) is node \(i\)'s block of \(X\)
  definition_zh: 堆叠可分目标的 Bregman 距离
  source_arxiv:
