normalization_rules:
- Do not introduce a new symbol if an existing notation entry has the same meaning.
- Do not reuse an existing symbol for a different meaning. If a paper uses the same letter differently, rename it
  to an unambiguous shared symbol and record the normalization note.
- Rewrite global objectives named \(f\), \(\bar f\), or \(p\) as \(F\).
- Rewrite strong convexity parameters as \(\mu\), smoothness parameters as \(L\), and condition numbers as \(\kappa=L/\mu\).
- Rewrite node counts to \(n\); reserve \(M\) for nonsmooth Lipschitz/subgradient bounds.
- Use \(K_{\rm loc}\) only for local finite-sum size, \(T\) for an iteration horizon, and \(T_{\rm out}\) for an outer
  horizon with batching or multi-gossip.
- Use \(\rho\) for static gossip spectral gap and \(\delta_{\rm net}\) for generic network gap. Do not use bare \(\delta\)
  in final table cells.
- Use \(\delta_{\rm G}\) for Goldstein stationarity radius and \(\delta_{\rm ht}\) for heavy-tail/moment parameters.
- Keep paper-specific merit functions \(G\), \(Q\), \(G_a\), and \(\Eloc\) only when the target is not an ordinary
  objective gap, distance, or gradient norm.
- Every symbol appearing in a Measure/LB/UB cell must have exactly one entry in this file before the table is rendered.
- Communication rounds, bits, and wall-clock quantities stay out of the main oracle-query rate.
